<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bobo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noar AI — Personal AI Desktop Assistant</title>
    <!-- Google Fonts: Noto Sans Thai & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Immediate Theme Initialization to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bo_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-transparent text-slate-100 antialiased overflow-hidden select-none font-sans">
    <div id="root" class="w-full h-full bg-transparent"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
